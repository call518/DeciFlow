provider = "google"
https_address = "0.0.0.0:4443"
tls_cert_file = "/etc/oauth2-proxy/tls/fullchain.pem"
tls_key_file = "/etc/oauth2-proxy/tls/privkey.pem"
authenticated_emails_file = "/etc/oauth2-proxy/allowed-emails.txt"

# Allow only listed emails; do not add email_domains = ["*"].
# 목록에 등록된 이메일만 허용합니다. email_domains = ["*"]를 추가하지 마세요.
email_domains = []
reverse_proxy = false
pass_access_token = false
pass_authorization_header = false
pass_basic_auth = false
pass_user_headers = false
cookie_name = "__Host-deciflow_session"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"
cookie_refresh = "1h"
cookie_expire = "8h"
code_challenge_method = "S256"

# API clients receive 401 instead of an HTML login redirect.
# API 클라이언트에는 HTML 로그인 리다이렉트 대신 401을 반환합니다.
api_routes = ["^/api(?:/|$)"]
flush_interval = "100ms"
upstream_timeout = "0s"
