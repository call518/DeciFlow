[project]
name = "deciflow"
version = "0.1.0"
description = "Streaming log classification with Laya and Jev"
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.24.1",
    "croniter>=6.2.4",
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "python-dotenv>=1.2.4",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
laya = [
    "laya[serve]==0.4.1",
]

[tool.ruff]
line-length = 88
extend-exclude = ["vendor"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["actions.py", "classifier.py", "config.py", "server.py", "sources.py", "laya_server.py", "profiles", "chunks.py", "source_settings.py", "source_registry.py", "remote_sources.py", "configured_sources.py", "host_sources.py", "tasks.py", "jobs.py", "ssh_hosts.py", "ssh_keys.py", "tests"]
exclude = [".venv", "vendor"]
pythonVersion = "3.11"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
