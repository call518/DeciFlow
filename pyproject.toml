[build-system]
requires = ["hatchling==1.32.4", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "deciflow"
dynamic = ["version"]
description = "Streaming log classification with Laya and Jev"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.24.1",
    "croniter>=6.2.4",
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pyarrow==26.0.0",
    "python-dotenv>=1.2.4",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
deciflow = "deciflow.cli:main"

[project.urls]
Homepage = "https://github.com/call518/DeciFlow"
Documentation = "https://github.com/call518/DeciFlow/tree/main/docs"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["deciflow"]

[tool.hatch.build.targets.wheel.force-include]
"public" = "deciflow/public"
"images" = "deciflow/images"
".env.example" = "deciflow/.env.example"
"docs/criteria.md" = "deciflow/docs/criteria.md"
"oauth2-proxy/oauth2-proxy.cfg" = "deciflow/oauth2-proxy/oauth2-proxy.cfg"
"oauth2-proxy/allowed-emails.example.txt" = "deciflow/oauth2-proxy/allowed-emails.example.txt"

[tool.hatch.build.targets.sdist]
include = ["/deciflow", "/public", "/images", "/.env.example", "/docs/criteria.md", "/oauth2-proxy/oauth2-proxy.cfg", "/oauth2-proxy/allowed-emails.example.txt", "/README.md", "/LICENSE", "/pyproject.toml"]

[project.optional-dependencies]
laya = [
    "laya[serve]==0.4.13",
]

[tool.ruff]
line-length = 88
extend-exclude = ["vendor"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["deciflow", "server.py", "laya_server.py", "scripts", "tests"]
exclude = [".venv", "vendor"]
pythonVersion = "3.11"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
